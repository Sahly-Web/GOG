          const reply = 'جاري تشغيل الأذان الآن 🕌🔊';
          pushMsg('bot', reply, '🕌 تشغيل الأذان الحي');
          return;
        }

        if (norm.includes('صليت') || norm.includes('سجل صلا') || norm.includes('قران') || norm.includes('صفحات') || norm.includes('سبحت') || norm.includes('تسبيح')) {
          if (norm.includes('كل الصلوات')) {
            setState((prev) => ({
              ...prev,
              prayers: prev.prayers.map((p) => p.id !== 'sunrise' ? { ...p, completed: true } : p)
            }));
            awardXP(50);
          } else {
            const prayerMap = [
              { key: 'فجر', id: 'fajr', name: 'الفجر' },
              { key: 'ظهر', id: 'dhuhr', name: 'الظهر' },
              { key: 'عصر', id: 'asr', name: 'العصر' },
              { key: 'مغرب', id: 'maghrib', name: 'المغرب' },
              { key: 'عشا', id: 'isha', name: 'العشاء' }
            ];
            prayerMap.forEach((pm) => {
              if (norm.includes(pm.key)) {
                setState((prev) => ({
                  ...prev,
                  prayers: prev.prayers.map((p) => p.id === pm.id ? { ...p, completed: true } : p)
                }));
                awardXP(15);
              }
            });
          }
          if (norm.includes('قران') || norm.includes('صفح')) {
            const pages = numVal && numVal <= 604 ? Math.round(numVal) : 4;
            setState((prev) => ({
              ...prev,
              athkar: {
                ...prev.athkar,
                quranPagesRead: (prev.athkar.quranPagesRead || 0) + pages,
                khatmahTotalPages: Math.min(604, (prev.athkar.khatmahTotalPages || 0) + pages)
              }
            }));
            awardXP(15);
          }
          if (norm.includes('سبح') || norm.includes('تسبيح')) {
            const count = numVal && numVal <= 5000 ? Math.round(numVal) : 33;
            setState((prev) => ({
              ...prev,
              athkar: { ...prev.athkar, tasbihCount: norm.includes('صفر') ? 0 : (prev.athkar.tasbihCount || 0) + count }
            }));
            awardXP(10);
          }
          const reply = 'تقبل الله طاعتك! تم تحديث سجل العبادة اليومي بنجاح 🕌✨';
          pushMsg('bot', reply, '🕌 تحديث سجل العبادة');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // J. إضافة أو تعديل أو إتمام التمارين الرياضية وتعديل الأوزان
        // ------------------------------------------------------------------
        if ((norm.includes('عدل وزن') || norm.includes('خلي وزن التمرين')) && numVal) {
          const wVal = Math.round(numVal);
          const todayDayIdx = new Date().getDay();
          setState((prev) => ({
            ...prev,
            weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
              if (w.dayOfWeek !== todayDayIdx) return w;
              return {
                ...w,
                exercises: (w.exercises || []).map((ex, i) => (i === 0 ? { ...ex, weightKg: wVal } : ex))
              };
            })
          }));
          const reply = `تم تعديل الوزن في تمرينك إلى ${wVal} كجم بنجاح 🏋️‍♂️✅`;
          pushMsg('bot', reply, `🏋️‍♂️ الوزن: ${wVal} كجم`);
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        if ((norm.includes('خلصت') || norm.includes('انجزت') || norm.includes('اتممت')) && (norm.includes('تمرين') || norm.includes('تمارين'))) {
          const todayDayIdx = new Date().getDay();
          setState((prev) => ({
            ...prev,
            weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
              if (w.dayOfWeek !== todayDayIdx) return w;
              return {
                ...w,
                exercises: (w.exercises || []).map((ex) => ({ ...ex, completed: true }))
              };
            })
          }));
          awardXP(30);
          const reply = 'بطل! تم تسجيل إتمام تمارين اليوم بالكامل وإضافة +30 XP لحسابك 💪🏆';
          pushMsg('bot', reply, '💪 إتمام تمارين اليوم');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        if (norm.includes('تمرين') || norm.includes('مجموعات') || norm.includes('عدات') || norm.includes('عقله') || norm.includes('سكوات')) {
          const exTime = extractTimeFromCommand(text) || '19:00';
          const setsMatch = text.match(/(\d+)\s*مجموع/);
          const repsMatch = text.match(/(\d+)\s*عد/);
          const setsCount = setsMatch ? setsMatch[1] : '4';
          const repsCount = repsMatch ? repsMatch[1] : '12';
          let cleanExTitle = text
            .replace(/^(ضيف|اضف|سجل|ذكرني بـ|ذكرني)\s*/i, '')
            .replace(/الساع[ةه]\s*\d{1,2}(\s*:\s*\d{2})?(\s*ونص|\s*ونصف)?/g, '')
            .replace(/\d{1,2}:\d{2}/g, '')
            .trim();
          if (!cleanExTitle) cleanExTitle = 'تمرين رياضي مخصص';

          const newExObj = {
            id: `ai_ex_${Date.now()}`,
            nameAr: cleanExTitle,
            nameEn: cleanExTitle,
            sets: setsCount,
            reps: repsCount,
            weightKg: 20,
            time: exTime,
            completed: false,
            notified: false
          };

          const todayDayIdx = new Date().getDay();
          setState((prev) => ({
            ...prev,
            weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
              if (w.dayOfWeek !== todayDayIdx) return w;
              return { ...w, isRestDay: false, exercises: [newExObj, ...(w.exercises || [])] };
            })
          }));
          awardXP(10);
          const reply = `بطل! أضفت "${cleanExTitle}" (${setsCount} مجموعات × ${repsCount} عدة) الساعة ${exTime} إلى جدولك الرياضي اليوم 💪.`;
          pushMsg('bot', reply, `💪 تمرين جديد (${exTime})`);
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // K. إضافة أو إتمام العادات اليومية (Habits)
        // ------------------------------------------------------------------
        if (norm.includes('عاده') || norm.includes('عاداتي')) {
          let cleanHabit = text.replace(/^(ضيف|اضف|سجل)\s*(عاد[ةه])?\s*/i, '').trim();
          if (!cleanHabit) cleanHabit = 'عادة يومية جديدة';
          const newHab = { id: `hab_${Date.now()}`, title: cleanHabit, streak: 1, completedToday: false };
          setHabitsList((prev) => {
            const next = [newHab, ...prev];
            try {
              const raw = JSON.parse(localStorage.getItem('smartLifeAppState') || '{}');
              raw.habits = next;
              localStorage.setItem('smartLifeAppState', JSON.stringify(raw));
            } catch (e) { }
            return next;
          });
          awardXP(10);
          const reply = `تمت إضافة العادة اليومية "${cleanHabit}" إلى قائمة عاداتك بنجاح 🔄🔥`;
          pushMsg('bot', reply, '🔄 إضافة عادة يومية');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // L. تسجيل أو تعديل التغذية والبروتين والسعرات والخطوات
        // ------------------------------------------------------------------
        if (norm.includes('خطوه') || norm.includes('خطوات') || norm.includes('مشيت')) {
          const stp = numVal && numVal >= 50 ? Math.round(numVal) : 1000;
          setState((prev) => ({
            ...prev,
            vitals: { ...prev.vitals, steps: norm.includes('صفر') ? 0 : (prev.vitals.steps || 0) + stp }
          }));

          const reply = `تم تحديث عداد خطواتك اليومي (+${stp} خطوة) 👟🔥`;

        if (norm.includes('بروتين') || norm.includes('وجب') || norm.includes('سعره') || norm.includes('سعرات') || norm.includes('اكلت') || norm.includes('غداء') || norm.includes('افطار') || norm.includes('عشاء')) {
          if (norm.includes('صفر') || norm.includes('امسح')) {
            setState((prev) => ({
              ...prev,
              vitals: { ...prev.vitals, proteinGrams: 0, caloriesConsumed: 0 }
            }));
            const reply = 'تم تصفير سجل البروتين والسعرات اليومي 🥗↺';
            pushMsg('bot', reply, '🥗 تصفير التغذية');
            speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
            return;
          }
          const grams = numVal && numVal <= 250 ? Math.round(numVal) : 35;
          const kcal = numVal && numVal > 250 ? Math.round(numVal) : grams * 12;
          setState((prev) => ({
            ...prev,
            vitals: {
              ...prev.vitals,
              proteinGrams: (prev.vitals.proteinGrams || 0) + (numVal && numVal > 250 ? 25 : grams),
              caloriesConsumed: (prev.vitals.caloriesConsumed || 0) + kcal

          }));
          awardXP(10);
          const reply = `بالهناء والشفاء! تم تحديث متتبع التغذية (+${numVal && numVal > 250 ? 25 : grams}g بروتين و+${kcal} سعرة حرارية) 🍗🥗.`;
          pushMsg('bot', reply, `🍗 +${kcal} kcal`);
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // M. إدارة الأدوية والقياسات الحيوية (الضغط / السكر / النبض / النوم)
        // ------------------------------------------------------------------
        if ((norm.includes('ضيف دواء') || norm.includes('اضف دواء') || norm.includes('سجل دواء') || norm.includes('ضيف فيتامين')) && !norm.includes('ذكرني')) {
          const mTime = extractTimeFromCommand(text) || '09:00';
          const cleanMed = text
            .replace(/^(ضيف|اضف|سجل)\s*(دواء|فيتامين|مكمل)?\s*/i, '')
            .replace(/الساع[ةه]\s*\d{1,2}(\s*:\s*\d{2})?(\s*ونص|\s*ونصف)?/g, '')
            .replace(/\d{1,2}:\d{2}/g, '')
            .trim() || 'دواء يومي';
          setState((prev) => ({
            ...prev,
            medicines: [
              { id: `med_${Date.now()}`, name: cleanMed, dosage: 'جرعة يومية', time: mTime, completedToday: false, streakDays: 1, category: 'vitamin' },
              ...(prev.medicines || [])
            ]
          }));
          const reply = `تمت إضافة "${cleanMed}" الساعة ${mTime} إلى جدول أدويتك ومكملاتك بنجاح 💊✅`;
          pushMsg('bot', reply, `💊 دواء جديد (${mTime})`);
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        if (norm.includes('اخذت الدواء') || norm.includes('شربت الدواء') || norm.includes('اخذت كل الادويه')) {
          setState((prev) => ({
            ...prev,
            medicines: (prev.medicines || []).map((m) => ({ ...m, completedToday: true, streakDays: (m.streakDays || 0) + 1 }))
          }));
          awardXP(15);
          const reply = 'بالشفاء والعافية! تم تعليم أدويتك اليوم كمكتملة 💊✅';
          pushMsg('bot', reply, '💊 إتمام جرعة الدواء');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        if (norm.includes('ضغط') || norm.includes('سكر') || norm.includes('نبض') || norm.includes('نمت ') || norm.includes('ساعات النوم')) {
          const bpMatch = text.match(/(\d{2,3}\s*\/\s*\d{2,3})/);
          setState((prev) => ({
            ...prev,
            vitals: {
              ...prev.vitals,
              bloodPressure: bpMatch ? bpMatch[1].replace(/\s+/g, '') : prev.vitals.bloodPressure,
              bloodSugar: (!bpMatch && norm.includes('سكر') && numVal) ? String(numVal) : prev.vitals.bloodSugar,
              heartRate: (!bpMatch && norm.includes('نبض') && numVal) ? String(numVal) : prev.vitals.heartRate,
              sleepHours: (!bpMatch && (norm.includes('نمت') || norm.includes('نوم')) && numVal) ? numVal : prev.vitals.sleepHours
            }
          }));
          awardXP(10);
          const reply = 'تم تحديث قياساتك الحيوية في السجل الصحي تلقائياً 🩺✅';
          pushMsg('bot', reply, '🩺 تحديث القياسات الصحية');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // N. إضافة مهمة أو تذكير بمنبه صوتي (Tasks & Alarms)
        // ------------------------------------------------------------------
        if (
          norm.includes('ذكرني') ||
          norm.includes('مهمه') ||
          norm.includes('منبه') ||
          norm.includes('موعد') ||
          norm.includes('الساعه') ||
          norm.includes('دواء') ||
          /\d{1,2}:\d{2}/.test(text)
        ) {
          const alarmTime = extractTimeFromCommand(text) || '18:00';
          let cleanTask = text
            .replace(/^(ذكرني اني|ذكرني ان|ذكرني بـ|ذكرني|ضيف مهمه|اضف مهمه|سجل مهمه|ضيف مهمة|اضف مهمة)\s*/i, '')
            .replace(/الساع[ةه]\s*\d{1,2}(\s*:\s*\d{2})?(\s*ونص|\s*ونصف)?/g, '')
            .replace(/\d{1,2}:\d{2}/g, '')
            .trim();
          if (!cleanTask) cleanTask = text;

          const newTaskItem = {
            id: `tsk_${Date.now()}`,
            titleAr: cleanTask,
            titleEn: cleanTask,
            time: alarmTime,
            date: new Date().toISOString().slice(0, 10),
            priority: 'high',
            category: 'personal',
            completed: false,
            notified: false
          };

          setState((prev) => ({
            ...prev,
            tasks: [newTaskItem, ...(prev.tasks || [])]
          }));
          awardXP(10);
          const reply = `أبشر! أضفت مهمة "${cleanTask}" وضبطت المنبه الصوتي الساعة ${alarmTime} ⏰✅.`;
          pushMsg('bot', reply, `⏰ مهمة + منبه (${alarmTime})`);
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // O. إتمام المهام بالصوت
        // ------------------------------------------------------------------
        if (norm.includes('انجزت') || norm.includes('خلصت') || norm.includes('اتممت')) {
          setState((prev) => {
            if (norm.includes('كل المهام')) {
              return { ...prev, tasks: (prev.tasks || []).map((t) => ({ ...t, completed: true })) };
            }
            const firstPendingIdx = (prev.tasks || []).findIndex((t) => !t.completed);
            if (firstPendingIdx === -1) return prev;
            const updated = [...prev.tasks];
            updated[firstPendingIdx] = { ...updated[firstPendingIdx], completed: true };
            return { ...prev, tasks: updated };
          });
          awardXP(15);
          const reply = 'أحسنت يا بطل! تم تعليم المهمة كمكتملة وإضافة +15 نقطة خبرة لحسابك 🏆✅';
          pushMsg('bot', reply, '✅ إتمام مهمة (+15 XP)');
          speakAssistantText(reply, state.user.voiceAssistantEnabled !== false, lang);
          return;
        }

        // ------------------------------------------------------------------
        // P. الاتصال بالذكاء الاصطناعي الحر المجاني عند توفر الإنترنت + رد ذكي بدون إنترنت
        // ------------------------------------------------------------------
        if (isOnline) {
          try {
            const prompt = `أنت المساعد الشخصي الذكي داخل تطبيق "خطوة" لإدارة المهام والرياضة والعبادة والصحة. أجب باختصار شديد وود وحيوية باللغة العربية في جملتين فقط على رسالة المستخدم: ${text}`;
            const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
            if (response.ok) {
              const aiReply = (await response.text()).trim();
              if (aiReply) {
                pushMsg('bot', aiReply, '🤖 مساعد خطوة الذكي');
                speakAssistantText(aiReply, state.user.voiceAssistantEnabled !== false, lang);
                return;
              }
            }
          } catch (e) { }
        }

        const fallbackMsg = `تم تسجيل "${text}" كمهمة جديدة في جدول اليوم! يمكنك أن تطلب مني تعديل أي شيء في التطبيق (مثل: "خلي وزني 78"، "غير جدول التمارين لأرنولد"، "سجل الضغط 120/80"، "شربت 500 مل ماء"، أو "ذكرني بالدواء الساعة 18:00") وسأنفذه تلقائياً!`;
        setState((prev) => ({
          ...prev,
          tasks: [
            {
              id: `tsk_${Date.now()}`,
              titleAr: text,
              titleEn: text,
              time: '18:00',
              date: new Date().toISOString().slice(0, 10),
              priority: 'high',
              category: 'personal',
              completed: false,
              notified: false
            },
            ...(prev.tasks || [])
          ]
        }));
        pushMsg('bot', fallbackMsg, '📋 حفظ تلقائي في المهام');
        speakAssistantText(fallbackMsg, state.user.voiceAssistantEnabled !== false, lang);
      };

      const handleStartAiVoiceRecognition = () => {
        startUniversalLiveSpeechToText('chat');
      };

      if (!state.user.isOnboarded) {
        return (
          <OnboardingWizard
            initialProfile={state.user}
            onComplete={handleOnboardingComplete}
            onRestoreCloud={(cloudState) => setState((prev) => ({ ...prev, ...cloudState, user: { ...prev.user, ...(cloudState.user || {}), isOnboarded: true } }))}
          />
        );
      }

      const upcomingPrayer = getUpcomingPrayer(state.prayers);
      const currentDayIndex = new Date().getDay();
      const todayWorkout = state.weeklyWorkouts.find((w) => w.dayOfWeek === currentDayIndex) || state.weeklyWorkouts[0];
      const activeWorkoutPlan = state.weeklyWorkouts.find((w) => w.dayOfWeek === selectedWorkoutDay) || todayWorkout;

      const navItems = [
        { id: 'timeline', label: t.nav.dashboard, icon: '⚡' },
        { id: 'fitness', label: t.nav.fitness, icon: '💪' },
        { id: 'prayers', label: t.nav.prayers, icon: '🕌' },
        { id: 'medicines', label: t.nav.health, icon: '🩺' },
        { id: 'focus', label: t.nav.focus, icon: '🎯' },
        { id: 'hydration', label: t.nav.hydration, icon: '💧' },
        { id: 'levels', label: isAr ? 'المستويات' : 'Levels', icon: '🏆' },
        { id: 'birthdays', label: t.nav.family, icon: '🎂' },
        { id: 'cloud', label: t.nav.cloud, icon: '🎨' }
      ];

      return (
        <div className="min-h-screen pb-52 lg:pb-24">
          {/* ====================================================================
              DYNAMIC LOGICAL HEADER (RTL: Brand Right, Settings Gear Top-Left;
              LTR: Brand Left, Settings Gear Top-Right via flex justify-between)
              ==================================================================== */}
          <header className="sticky top-0 z-40 glass-card border-x-0 border-t-0 py-3">
            <div className="max-w-7xl mx-auto logical-header-bar gap-3">

              <div className="flex items-center gap-3 cursor-pointer min-w-0" onClick={() => setActiveTab('timeline')}>
                <div className="logical-start-text min-w-0">
                  <div className="font-black text-xl sm:text-2xl tracking-tight leading-none truncate accent-text">
                    <BrandName />
                  </div>
                  {state.user.name && (
                    <div className="text-xs sm:text-sm theme-text-muted font-bold truncate mt-1">
                      {state.user.name}
                    </div>
                  )}
                </div>
              </div>

              {/* Language Switcher & Bare Gear Settings Trigger (No Online Badge Clutter) */}
              <div className="flex items-center gap-2.5">
                {/* Quick Language Pill */}
                <select
                  aria-label="Quick Language Switcher"
                  value={state.user.language}
                  onChange={(e) => { soundFX.playClick(); updateUserField({ language: e.target.value }); }}
                  className="hidden sm:block px-3 py-2 rounded-xl surface-field text-xs font-black touch-target"
                >
                  {LANGUAGES_LIST.map((l) => (
                    <option key={l.code} value={l.code}>
                      {l.flag} {l.name}
                    </option>
                  ))}

                <button
                  id="global-settings-trigger"
                  type="button"
                  onClick={() => { soundFX.playClick(); setIsSettingsOpen(true); }}
                  aria-label={t.common.settingsBtn}
                  title={t.common.settingsBtn}
                  style={{
                    background: 'transparent',
                    border: 'none',
                    boxShadow: 'none',
                    padding: '8px',
                    cursor: 'pointer',
                    fontSize: '1.5rem',
                    lineHeight: 1
                  }}
                >
                  ⚙️
                </button>
              </div>
            </div>

            {/* Desktop Segmented Navigation Dock */}
            <div className="max-w-7xl mx-auto hidden lg:flex flex-wrap items-center gap-2 pt-3 mt-3 px-4 border-t theme-border">
              {navItems.map((item) => {

                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => { soundFX.playClick(); setActiveTab(item.id); }}
                    className={`px-3.5 py-2 rounded-2xl text-xs font-black flex items-center gap-2 transition-all ${active ? 'btn-primary shadow-md' : 'glass-card opacity-80 hover:opacity-100'

          {/* 🕌 LIVE ADHAN FULL-SCREEN LUXURY MODAL */}
          {activeAdhanAlert && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4">
              <div className="w-full max-w-md hero-card rounded-3xl p-6 text-center space-y-4 border-2 border-cyan-400 shadow-2xl">

                    <span className="text-[10px] font-black mt-1 truncate max-w-full leading-tight">
                      {item.label.split(' ')[0]}
                    </span>
                  </button>
                );
              })}
              <button
                type="button"
                onClick={() => { soundFX.playClick(); setIsSettingsOpen(true); }}
                className="flex flex-col items-center justify-center py-1.5 px-1 rounded-2xl surface-field opacity-85 hover:opacity-100"
              >
                <NavSvgIcon id="settings" className="w-4 h-4" />
                <span className="text-[10px] font-black mt-1 truncate max-w-full leading-tight">
                  {t.common.settingsBtn}
                </span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
