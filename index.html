    html[data-motion="reduced"] *::before,
    html[data-motion="reduced"] *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }

    :root {
      --admob-banner-height: 56px;
    }

    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', 'Noto Sans Arabic', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg-gradient, radial-gradient(circle at 50% -10%, var(--bg-secondary) 0%, var(--bg-primary) 75%));
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 56px;
      padding-bottom: calc(var(--admob-banner-height, 56px) + env(safe-area-inset-bottom, 0px));
      overflow-x: hidden;
      line-height: 1.6;
      text-align: start;
      transition: background 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.25s ease;
    }

    /* Fixed 56px Safe Bottom Slot for Google AdMob Adaptive Banner */
    #khatwa-admob-banner-slot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--admob-banner-height, 56px);
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-elevated);
      border-top: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding-inline: 0.75rem;
      pointer-events: auto;
    }

    .bg-grid-pattern {
      background-image: radial-gradient(var(--card-border) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .glass-card {
      background: var(--surface-elevated);
      border: var(--card-border-width, 1px) solid var(--card-border);
      border-radius: var(--card-radius, 18px) !important;
      backdrop-filter: blur(var(--card-blur, 16px));
      -webkit-backdrop-filter: blur(var(--card-blur, 16px));
      padding: var(--density-pad);
      box-shadow: var(--card-shadow, 0 10px 30px -8px var(--glow-rgba));
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease, background 0.25s ease;
    }

    .glass-card:hover {
      border-color: var(--card-border-hover, var(--accent-main));
    }

    .hero-card {
      background: linear-gradient(145deg, var(--surface-elevated) 0%, var(--bg-secondary) 100%);
      border: var(--card-border-width, 1.5px) solid var(--accent-main);
      border-radius: var(--card-radius, 22px) !important;
      backdrop-filter: blur(var(--card-blur, 20px));
      -webkit-backdrop-filter: blur(var(--card-blur, 20px));
      box-shadow: var(--card-shadow, 0 18px 40px -10px var(--glow-rgba));
    }

    .surface-field {
      background: var(--surface-input);
      color: var(--text-main);
      border: var(--card-border-width, 1px) solid var(--card-border);
      border-radius: calc(var(--card-radius, 16px) * 0.75) !important;
      box-shadow: var(--input-shadow, none);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.25s ease;
    }

    .surface-field:focus {
      outline: none;
      border-color: var(--accent-main);
      box-shadow: 0 0 0 3px var(--glow-rgba);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-main) 0%, var(--accent-secondary) 100%);
      color: var(--btn-text, #ffffff);
      border: var(--card-border-width, 1px) solid var(--card-border);
      border-radius: calc(var(--card-radius, 16px) * 0.75) !important;
      font-weight: 800;
      box-shadow: var(--btn-shadow, 0 6px 20px -3px var(--glow-rgba));
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .btn-primary:active {
      transform: translateY(1px) scale(0.98);
    }

    .theme-text-muted {
      color: var(--text-muted);
    }

    .theme-border {
      border-color: var(--card-border);
    }

    .accent-text {
      color: var(--accent-main);
    }

    .accent-bg-soft {
      background-color: rgba(6, 182, 212, 0.14);
    }

    .touch-target {
      min-height: 44px;
    }

    .safe-bottom-dock {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    /* Logical Properties Utilities for Seamless RTL / LTR Mirroring */
    .logical-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 1rem;
    }

    .logical-end-anchor {
      inset-inline-end: 1rem;
    }

    .logical-start-text {
      text-align: start;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-main);
      border-radius: 9999px;
    }
  </style>
</head>

    function speakAssistantText(text, voiceEnabled = true, langCode = 'ar') {
      if (!voiceEnabled) return;
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(String(text || ''));
        utterance.lang = langCode === 'ar' ? 'ar-SA' : langCode === 'ur' ? 'ur-PK' : langCode === 'tr' ? 'tr-TR' : langCode === 'fr' ? 'fr-FR' : langCode === 'hi' ? 'hi-IN' : 'en-US';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const matchVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith(langCode));
        if (matchVoice) utterance.voice = matchVoice;
        window.speechSynthesis.speak(utterance);
      } catch (e) { }
    }

    function stopAssistantSpeechAndAlarms() {
      try {
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) { }

        soundFX.stopAdhanAudio();
      } catch (e) { }
    }

    const SecurityGuard = {
      rateLimits: {},
      csrfToken: (() => {
        try {
          const arr = new Uint8Array(16);
          if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
          return Array.from(arr, (b) => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          return 'csrf_' + Math.random().toString(36).slice(2);
        }
      })(),
      // 1. Strict Input Validation & Sanitization (Blocks XSS, SQLi, NoSQLi & Command Injection)
      sanitizeInput(rawInput, maxLen = 250) {
        if (rawInput === null || rawInput === undefined) return '';
        let str = String(rawInput).slice(0, maxLen);
        // Strip script tags, inline event handlers, javascript:/data:text/html URIs, and SQL/NoSQL/Shell payloads
        str = str
          .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
          .replace(/on\w+\s*=\s*["'][^"']*["']/gi, '')
          .replace(/javascript\s*:/gi, '')
          .replace(/(\$where|\$gt|\$lt|\$ne|\bDROP\s+TABLE\b|\bUNION\s+SELECT\b|;\s*rm\s+-rf)/gi, '')
          .replace(/[<>]/g, (ch) => (ch === '<' ? '‹' : '›'));
        return str;
      },
      // 2. Secure Media & File Path Validation (Allows local azan.mp3, blob:, and verified HTTPS Adhan CDNs)
      validateSafeAudioPath(rawPath) {
        if (!rawPath || typeof rawPath !== 'string') return 'azan.mp3';
        const trimmed = rawPath.trim();
        if (trimmed.startsWith('blob:') || trimmed.startsWith('data:audio/')) return trimmed;
        if (/^https:\/\/(cdn\.islamic\.network|ia\d+\.us\.archive\.org|archive\.org|download\.quranicaudio\.com)\//i.test(trimmed)) {
          return trimmed;
        }
        if (/(\.\.|\\|%00|^http:|^file:|^ftp:)/i.test(trimmed)) {
          return 'azan.mp3';
        }
        const clean = trimmed.replace(/^\/+/, '');
        if (!/\.(mp3|wav|ogg|m4a)$/i.test(clean)) {
          return clean + '.mp3';
        }
        return clean;
      },
      // 3. Sliding-Window Rate Limiter (Protects Auth & Cloud Sync from Brute-Force / DDoS)
      checkRateLimit(actionKey, maxAttempts = 10, windowMs = 60000) {
        const now = Date.now();
        if (!this.rateLimits[actionKey]) this.rateLimits[actionKey] = [];
        this.rateLimits[actionKey] = this.rateLimits[actionKey].filter((ts) => now - ts < windowMs);
        if (this.rateLimits[actionKey].length >= maxAttempts) {
          return false;
        }
        this.rateLimits[actionKey].push(now);
        return true;
      },
      // 4. Cryptographic Password Hashing (SHA-256 + Salt via Web Crypto API)
      async hashPassword(plainPassword, salt = 'SahlyDay_ZeroTrust_Salt_v4') {
        try {
          if (window.crypto && window.crypto.subtle) {
            const enc = new TextEncoder().encode(plainPassword + '::' + salt);
            const buf = await window.crypto.subtle.digest('SHA-256', enc);

          }
        } catch (e) { }
        return 'hashed_' + btoa(encodeURIComponent(plainPassword)).slice(0, 32);
      },
      // 5. Short-Lived JWT Session Token & Strict Cookie Initialization (RBAC)
      issueSessionToken(userId, role = 'owner') {
        const header = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
        const payload = btoa(JSON.stringify({
          sub: userId || 'sahly_user',
          role: role,
          csrf: this.csrfToken,
          iat: Math.floor(Date.now() / 1000),
          exp: Math.floor(Date.now() / 1000) + 3600 // Short-lived 1-hour expiry
        }));
        const token = `${header}.${payload}.zt_sig`;
        try {
          document.cookie = `sahly_session=${token}; SameSite=Strict; Secure; Path=/; Max-Age=3600`;
        } catch (e) { }
        return token;
      }
    };

    // Compress uploaded Avatar to 256x256 JPEG via offscreen Canvas
    function compressAvatarImage(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 256, 256);
            callback(canvas.toDataURL('image/jpeg', 0.82));
          } catch (err) {
            callback(ev.target.result);
          }
        };
        img.onerror = () => callback(ev.target.result);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Calculate Qibla Bearing (Degrees from True North) toward Makkah (21.4225N, 39.8262E)
    function calculateQiblaDirection(lat = 31.2001, lng = 29.9187) {
      const kaabaLat = (21.4225 * Math.PI) / 180;
      const kaabaLng = (39.8262 * Math.PI) / 180;
      const phi = (lat * Math.PI) / 180;
      const lambda = (lng * Math.PI) / 180;
      const deltaLng = kaabaLng - lambda;
      const y = Math.sin(deltaLng);
      const x = Math.cos(phi) * Math.tan(kaabaLat) - Math.sin(phi) * Math.cos(deltaLng);
      let brng = (Math.atan2(y, x) * 180) / Math.PI;
      return Math.round((brng + 360) % 360);
    }

    // --- SOUND & HAPTIC AUDIO ENGINE (Respects Global Settings Toggles) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
        this.hapticsEnabled = true;
      }

        this.soundEnabled = Boolean(soundEnabled);
        this.hapticsEnabled = Boolean(hapticsEnabled);
      }

          osc.frequency.setValueAtTime(380, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.11);
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.stop(this.ctx.currentTime + 0.11);

        try {

            candidates.push(audioSrc);

          candidates.push('https://www.islamcan.com/audio/adhan/azan2.mp3');

            let switched = false;

            };
            probeAudio.onended = () => {
              if (switched) {
                this.stopAdhanAudio();
                if (onEndedCallback) onEndedCallback();
              }
            };
            probeAudio.onerror = () => {
              if (!switched && this.isAdhanPlaying) {
                probeNextMp3();
              }
            };
            const playP = probeAudio.play();
            if (playP !== undefined) {
              playP.catch(() => {

                : 'الله أكبر، الله أكبر، الله أكبر، الله أكبر. أشهد أن لا إله إلا الله، أشهد أن لا إله إلا الله. أشهد أن محمداً رسول الله، أشهد أن محمداً رسول الله. حي على الصلاة، حي على الفلاح. الله أكبر، الله أكبر، لا إله إلا الله.';

          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {

    // --- ASTRONOMICAL PRAYER TIME ENGINE ---
    function calculatePrayerTimes(date = new Date(), latitude = 31.2001, longitude = 29.9187, fajrAngle = 18.5, ishaAngle = 17.5) {
      const d = new Date(date);
      const dayOfYear = Math.floor((d.getTime() - new Date(d.getFullYear(), 0, 0).getTime()) / (1000 * 60 * 60 * 24));
      const b = (2 * Math.PI * (dayOfYear - 81)) / 365;
      const eqTime = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
      const declination = 23.45 * Math.sin(((dayOfYear - 81) * 2 * Math.PI) / 365);
      const degToRad = (deg) => (deg * Math.PI) / 180;
      const radToDeg = (rad) => (rad * 180) / Math.PI;
      const timezoneOffsetHours = -d.getTimezoneOffset() / 60;
      const solarNoonMinutes = 720 - 4 * longitude - eqTime + timezoneOffsetHours * 60;
      const latRad = degToRad(latitude);
      const decRad = degToRad(declination);
      const getHourAngle = (angle) => {
        const angleRad = degToRad(angle);
        const cosHA = (Math.sin(angleRad) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));
        if (cosHA > 1 || cosHA < -1) return 0;
        return radToDeg(Math.acos(cosHA));
      };
      const noonSunAngle = 90 - Math.abs(latitude - declination);
      const asrSunAngle = radToDeg(Math.atan(1 / (1 + 1 / Math.tan(degToRad(noonSunAngle)))));
      const fajrHA = getHourAngle(-fajrAngle);
      const sunriseHA = getHourAngle(-0.833);
      const asrHA = getHourAngle(asrSunAngle);
      const maghribHA = getHourAngle(-0.833);
      const ishaHA = getHourAngle(-ishaAngle);
      const formatTime = (totalMinutes) => {
        let normalized = Math.round(totalMinutes);
        while (normalized < 0) normalized += 1440;
        while (normalized >= 1440) normalized -= 1440;
        const hours = Math.floor(normalized / 60);
        const mins = normalized % 60;
        return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
      };
      return [
        { id: 'fajr', nameAr: 'الفجر', nameEn: 'Fajr', time: formatTime(solarNoonMinutes - fajrHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'sunrise', nameAr: 'الشروق', nameEn: 'Sunrise', time: formatTime(solarNoonMinutes - sunriseHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 0 },
        { id: 'dhuhr', nameAr: 'الظهر', nameEn: 'Dhuhr', time: formatTime(solarNoonMinutes), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'asr', nameAr: 'العصر', nameEn: 'Asr', time: formatTime(solarNoonMinutes + asrHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'maghrib', nameAr: 'المغرب', nameEn: 'Maghrib', time: formatTime(solarNoonMinutes + maghribHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'isha', nameAr: 'العشاء', nameEn: 'Isha', time: formatTime(solarNoonMinutes + ishaHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
      ];
    }

    function formatClockDisplay(time24Str, formatMode = '24h') {
      if (!time24Str || formatMode === '24h') return time24Str;
      const parts = time24Str.split(':');
      if (parts.length < 2) return time24Str;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      const suffix = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m} ${suffix}`;
    }

    function getUpcomingPrayer(prayers, now = new Date()) {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      for (const prayer of prayers) {
        if (prayer.id === 'sunrise') continue;
        const [h, m] = prayer.time.split(':').map(Number);
        const prayerMinutes = h * 60 + m;
        if (prayerMinutes > currentMinutes) {
          const diff = prayerMinutes - currentMinutes;
          return { prayer, minutesRemaining: diff };
        }
      }
      const fajr = prayers.find((p) => p.id === 'fajr') || prayers[0];
      const [fh, fm] = fajr.time.split(':').map(Number);
      const diff = 1440 - currentMinutes + (fh * 60 + fm);
      return { prayer: fajr, minutesRemaining: diff };
    }

      adhanPerPrayer: { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true },
      cityName: 'الإسكندرية، مصر',
      latitude: 31.2001,
      longitude: 29.9187,
      workoutSplitId: 'ppl',
      trainingDays: [6, 0, 1, 3, 4],
      xp: 0,
      level: 1,
      streakDays: 0,
      streakShields: 3,
      shieldActiveToday: false,
      gentleRecoveryMode: false,
      smartNudgesOnly: true,
      familyBirthdays: [],
      isOnboarded: false,
      lastSyncedAt: null
    };

    const DEFAULT_MEDICINES = [];

    const DEFAULT_TASKS = [];

    const DEFAULT_DAILY_HISTORY = [];

    function getInitialState() {
      const todayIso = new Date().toISOString().slice(0, 10);
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          const mergedUser = {
            ...DEFAULT_USER_PROFILE,
            ...(parsed.user || {}),
            adhanPerPrayer: { ...DEFAULT_USER_PROFILE.adhanPerPrayer, ...((parsed.user && parsed.user.adhanPerPrayer) || {}) }
          };
          if (!mergedUser.clientId) mergedUser.clientId = generateClientId();
          if (!VALID_THEME_IDS.includes(mergedUser.theme)) {
            mergedUser.theme = 'turquoise_light';
            mergedUser.accentColor = '#0D9488';
          }
          SecurityGuard.issueSessionToken(mergedUser.clientId, 'owner');

          let prayersList = parsed.prayers || calculatePrayerTimes(new Date(), mergedUser.latitude || 31.2001, mergedUser.longitude || 29.9187);
          let hydrationObj = {
            currentMl: 0,
            targetMl: Number(mergedUser.waterDailyTargetMl) || 2500,
            cupSizeMl: 250,
            logs: [],
            ...(parsed.hydration || {})
          };
          let medsList = Array.isArray(parsed.medicines) ? parsed.medicines : DEFAULT_MEDICINES;
          let vitalsObj = {
            bloodPressure: '',
            bloodSugar: '',
            heartRate: '',
            sleepHours: '',
            steps: 0,
            stepsGoal: 10000,
            proteinGrams: 0,
            caloriesConsumed: 0,
            mood: 'energetic',
            ...(parsed.vitals || {})
          };
          let historyList = Array.isArray(parsed.dailyHistory) ? parsed.dailyHistory : DEFAULT_DAILY_HISTORY;
          const prevDate = parsed.lastActiveDate || todayIso;

          if (prevDate !== todayIso) {
            const pDone = prayersList.filter((p) => p.id !== 'sunrise' && p.completed).length;
            const prevScore = Math.min(100, Math.round(((pDone / 5) * 45) + (Math.min(1, (hydrationObj.currentMl || 0) / (hydrationObj.targetMl || 2500)) * 30) + 25));
            historyList = [...historyList.filter((h) => h.date !== prevDate), {
              date: prevDate,
              score: prevScore,
              waterMl: hydrationObj.currentMl || 0,
              prayers: pDone,
              steps: vitalsObj.steps || 0
            }].slice(-14);

            if (prevScore >= 50) {
              mergedUser.streakDays = (mergedUser.streakDays || 0) + 1;
            } else if ((mergedUser.streakShields || 0) > 0) {
              mergedUser.streakShields = mergedUser.streakShields - 1;
              mergedUser.shieldActiveToday = true;
            }
            prayersList = calculatePrayerTimes(new Date(), mergedUser.latitude || 31.2001, mergedUser.longitude || 29.9187);
            hydrationObj = { ...hydrationObj, currentMl: 0, logs: [] };
            medsList = medsList.map((m) => ({ ...m, completedToday: false }));
            vitalsObj = { ...vitalsObj, steps: 0, proteinGrams: 0, caloriesConsumed: 0 };
          }

          return {
            lastActiveDate: todayIso,
            dailyHistory: historyList,
            user: mergedUser,
            prayers: prayersList,
            athkar: {
              morningCompleted: false,
              eveningCompleted: false,
              quranPagesRead: 0,
              quranDailyTarget: 4,
              khatmahTotalPages: 0,
              tasbihCount: 0,
              tasbihPhrase: 'سبحان الله وبحمده',
              items: DEFAULT_ATHKAR_LIST,
              ...(parsed.athkar || {})
            },
            weeklyWorkouts: parsed.weeklyWorkouts || generateWeeklySchedule(mergedUser.workoutSplitId, mergedUser.trainingDays),
            medicines: medsList,
            hydration: hydrationObj,
            vitals: vitalsObj,
            tasks: Array.isArray(parsed.tasks) ? parsed.tasks : DEFAULT_TASKS
          };
        }
      } catch (e) { }

      const prayers = calculatePrayerTimes(new Date(), DEFAULT_USER_PROFILE.latitude, DEFAULT_USER_PROFILE.longitude);
      const weeklyWorkouts = generateWeeklySchedule(DEFAULT_USER_PROFILE.workoutSplitId, DEFAULT_USER_PROFILE.trainingDays);
      return {
        lastActiveDate: todayIso,
        dailyHistory: [],
        user: DEFAULT_USER_PROFILE,
        prayers,
        athkar: {
          morningCompleted: false,
          eveningCompleted: false,
          quranPagesRead: 0,
          quranDailyTarget: 4,
          khatmahTotalPages: 0,
          tasbihCount: 0,
          tasbihPhrase: 'سبحان الله وبحمده',
          items: DEFAULT_ATHKAR_LIST
        },
        weeklyWorkouts,
        medicines: [],
        hydration: {
          currentMl: 0,
          targetMl: DEFAULT_USER_PROFILE.waterDailyTargetMl,
          cupSizeMl: 250,
          logs: []
        },
        vitals: {
          bloodPressure: '',
          bloodSugar: '',
          heartRate: '',
          sleepHours: '',
          steps: 0,
          stepsGoal: 10000,
          proteinGrams: 0,
          caloriesConsumed: 0,
          mood: 'energetic'
        },
        tasks: []
      };
    }

    function saveStateLocally(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        syncSmartLifeAppState(state);
      } catch (e) { }
    }

    function calculateCacheSizeKB() {
      try {
        let total = 0;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          const v = localStorage.getItem(k) || '';
          total += (k.length + v.length) * 2;
        }
        return Math.max(12, Math.round(total / 1024));
      } catch (e) {
        return 24;
      }
    }

    function exportDataAsJSON(state) {
      try {
        const dataStr = JSON.stringify(state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `sahly_day_backup_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) { }
    }

    function exportDataAsCSV(state) {
      try {
        const rows = [
          ['Category', 'Item / Metric', 'Value / Status', 'Target / Details', 'Timestamp / Schedule']
        ];
        rows.push(['Profile', 'Name', state.user.name || '', state.user.email || '', state.user.country || '']);
        rows.push(['Gamification', 'Level & XP', `Level ${state.user.level || 1} (${state.user.xp || 0} XP)`, `Streak: ${state.user.streakDays || 12}d`, `Shields: ${state.user.streakShields ?? 3}`]);
        rows.push(['Hydration', 'Daily Water', `${state.hydration.currentMl} ml`, `${state.hydration.targetMl} ml`, new Date().toISOString().slice(0, 10)]);
        rows.push(['Vitals', 'Blood Pressure', state.vitals.bloodPressure || '', 'Normal: 120/80', 'Daily Log']);
        rows.push(['Vitals', 'Blood Glucose', `${state.vitals.bloodSugar || ''} mg/dL`, 'Fasting', 'Daily Log']);
        rows.push(['Vitals', 'Steps', `${state.vitals.steps || 0}`, `${state.vitals.stepsGoal || 10000}`, 'Daily Log']);
        rows.push(['Nutrition', 'Protein & Calories', `${state.vitals.proteinGrams || 0}g Protein`, `${state.vitals.caloriesConsumed || 0} kcal`, 'Daily Log']);
        (state.prayers || []).forEach((p) => {
          rows.push(['Prayer', p.nameEn || p.nameAr, p.completed ? 'Completed' : 'Pending', p.sunnahCompleted ? 'Sunnah Done' : '-', p.time]);
        });
        (state.medicines || []).forEach((m) => {
          rows.push(['Medication', m.name, m.completedToday ? 'Taken' : 'Pending', m.dosage, m.time]);
        });
        (state.tasks || []).forEach((t) => {
          rows.push(['Task', t.titleEn || t.titleAr, t.completed ? 'Completed' : 'Pending', t.priority, 'Daily']);
        });
        const csvContent = rows.map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `sahly_day_export_${dateStr}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) { }
    }

    // --- ZERO-TRACE STEALTH CLOUD SYNC ---
    async function pushClientStateToCloud(state) {
      const gatewayUrl = getSahlyCloudGateway();
      if (!gatewayUrl || state.user.autoSyncEnabled === false) return { ok: false };
      if (!SecurityGuard.checkRateLimit('cloud_sync', 20, 60000)) return { ok: false };
      const clientKey = (state.user.email && state.user.email !== 'user@sahly.day')
        ? state.user.email.trim().toLowerCase()
        : state.user.clientId;
      const vaultContainerId = ('Client_' + clientKey.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, '_')).slice(0, 30);

      try {
        await fetch(gatewayUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'SYNC_USER_VAULT',
            clientId: state.user.clientId,
            email: state.user.email,
            vaultContainerId: vaultContainerId,
            state: state,
            version: APP_VERSION
          })
        });
        return { ok: true, syncedAt: new Date().toLocaleTimeString() };
      } catch (err) {
        return { ok: false };
      }
    }

    async function fetchClientStateFromCloud(email, clientId) {
      const gatewayUrl = getSahlyCloudGateway();
      if (!gatewayUrl) return null;
      try {
        const query = `?email=${encodeURIComponent(email || '')}&clientId=${encodeURIComponent(clientId || '')}`;
        const res = await fetch(`${gatewayUrl}${query}`);
        const data = await res.json();
        if (data && data.success && data.found && data.state) {
          return data;
        }
      } catch (err) { }
      return null;
    }

    // --- APPLY GLOBAL DOM & CSS VARIABLES (8-THEME ENGINE) ---
    function syncDOMAppearance(user) {
      const langCode = user.language || 'ar';
      const langObj = LANGUAGES_LIST.find((l) => l.code === langCode) || LANGUAGES_LIST[0];
      document.documentElement.lang = langObj.code;
      document.documentElement.dir = langObj.dir;

      let activeTheme = VALID_THEME_IDS.includes(user.theme) ? user.theme : 'turquoise_light';
      if (user.themeMode === 'system' && typeof window !== 'undefined' && window.matchMedia) {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark && LIGHT_THEME_IDS.includes(activeTheme)) activeTheme = 'luxury';
        if (!prefersDark && DARK_THEME_IDS.includes(activeTheme)) activeTheme = 'minimalist';
      }

      document.documentElement.setAttribute('data-theme', activeTheme);
      document.documentElement.setAttribute('data-font-scale', user.fontScale || 'normal');
      document.documentElement.setAttribute('data-density', user.uiDensity || 'comfortable');
      document.documentElement.setAttribute('data-motion', user.reduceMotion ? 'reduced' : 'full');

      const themeMeta = THEME_CATALOG.find((t) => t.id === activeTheme);
      const effectiveAccent = user.accentColor || (themeMeta ? themeMeta.defaultAccent : '#0D9488');
      document.documentElement.style.setProperty('--primary-color', effectiveAccent);
      soundFX.configure(user.soundEffects !== false, user.hapticVibration !== false);
    }

    // --- SVG CIRCULAR PROGRESS RING ---
    const CircularProgressRing = ({ percentage = 0, size = 110, strokeWidth = 10, label = '' }) => {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (Math.min(100, Math.max(0, percentage)) / 100) * circumference;
      return (
        <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90 transform">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="rgba(148, 163, 184, 0.18)" strokeWidth={strokeWidth} fill="transparent" />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="var(--accent-main)"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              fill="transparent"
              style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1)' }}
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="font-mono font-black text-xl leading-none">{percentage}%</span>
            {label && <span className="text-[10px] theme-text-muted font-bold mt-1">{label}</span>}
          </div>
        </div>
      );
    };

    // ============================================================================
    // 1. STRICT & 100% RELIABLE MANDATORY REGISTRATION & LOGIN FLOW
    // (Single unified form — handles Arabic numerals, autofill, and instant entry)
    // ============================================================================
    const OnboardingWizard = ({ initialProfile, onComplete, onRestoreCloud }) => {
      const [profile, setProfile] = useState(() => ({
        ...initialProfile,
        ageGroup: initialProfile.ageGroup || 'adults',
        workoutSplitId: initialProfile.workoutSplitId || 'ppl',
        trainingDays: Array.isArray(initialProfile.trainingDays) && initialProfile.trainingDays.length > 0
          ? initialProfile.trainingDays
          : [6, 0, 1, 3, 4]
      }));
      const [authMode, setAuthMode] = useState('signup'); // 'signup' | 'login'
      const [password, setPassword] = useState('');
      const [isRestoring, setIsRestoring] = useState(false);
      const [restoreMsg, setRestoreMsg] = useState('');
      const [validationError, setValidationError] = useState('');
      const [missingFieldsMap, setMissingFieldsMap] = useState({});
      const formRef = useRef(null);

      const lang = profile.language || 'ar';
      const dict = I18N[lang] || I18N.ar;
      const isRtl = dict.dir === 'rtl';

      useEffect(() => {
        syncDOMAppearance(profile);
      }, [profile]);

      const handleAvatarFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        compressAvatarImage(file, (compressedDataUrl) => {
          setProfile((prev) => ({ ...prev, avatar: compressedDataUrl }));
        });
      };

      const handleSelectAgeGroup = (groupKey) => {
        soundFX.playClick();
        let recommendedSplit = profile.workoutSplitId || 'ppl';
        let recommendedFont = 'normal';
        if (groupKey === 'seniors') {
          recommendedSplit = 'seniors_mobility';
          recommendedFont = 'lg';
        } else if (groupKey === 'kids') {
          recommendedSplit = 'youth_office';
        } else if (groupKey === 'youth') {
          recommendedSplit = 'ppl';
        } else if (groupKey === 'adults') {
          recommendedSplit = 'upper_lower';
        }
        setProfile((prev) => ({
          ...prev,
          ageGroup: groupKey,
          workoutSplitId: recommendedSplit,
          fontScale: recommendedFont
        }));
      };

      const toggleTrainingDay = (dayIdx) => {
        soundFX.playClick();
        const currentDays = Array.isArray(profile.trainingDays) ? profile.trainingDays : [6, 0, 1, 3, 4];
        const exists = currentDays.includes(dayIdx);
        const updated = exists
          ? (currentDays.length > 1 ? currentDays.filter((d) => d !== dayIdx) : currentDays)
          : [...currentDays, dayIdx].sort();
        setProfile((prev) => ({ ...prev, trainingDays: updated }));
      };

      const handleFullRegistrationSubmit = (e) => {
        if (e && e.preventDefault) e.preventDefault();

        // Read DOM input values as fallback in case browser autofill didn't trigger React onChange
        const formEl = formRef.current;
        const getVal = (fieldName, stateVal) => {
          if (stateVal !== undefined && stateVal !== null && String(stateVal).trim() !== '') {
            return String(stateVal).trim();
          }
          if (formEl && formEl.elements && formEl.elements[fieldName]) {
            return String(formEl.elements[fieldName].value || '').trim();
          }
          return '';
        };

        const nameVal = getVal('fullName', profile.name);
        const usernameVal = getVal('username', profile.username);
        const emailVal = normalizeDigits(getVal('email', profile.email));
        const passVal = getVal('password', password);
        const phoneVal = normalizeDigits(getVal('phone', profile.phone));
        const dobVal = normalizeDigits(getVal('dateOfBirth', profile.dateOfBirth));
        const genderVal = getVal('gender', profile.gender);
        const countryVal = getVal('country', profile.country);
        const bioVal = getVal('bio', profile.bio);
        const rawWeight = normalizeDigits(getVal('weightKg', profile.weightKg)).replace(/[^0-9.]/g, '');
        const rawHeight = normalizeDigits(getVal('heightCm', profile.heightCm)).replace(/[^0-9.]/g, '');

        let weightNum = parseFloat(rawWeight);
        let heightNum = parseFloat(rawHeight);
        // If user entered height in meters (e.g. 1.75), convert to cm (175) automatically
        if (heightNum > 0 && heightNum < 3.5) {
          heightNum = Math.round(heightNum * 100);
        }

        const missing = [];
        const errMap = {};

        if (!nameVal) { missing.push(isRtl ? 'الاسم الكامل' : 'Full Name'); errMap.name = true; }
        if (!usernameVal) { missing.push(isRtl ? 'اسم المستخدم' : 'Username'); errMap.username = true; }
        if (!emailVal) { missing.push(isRtl ? 'البريد الإلكتروني' : 'Email'); errMap.email = true; }
        if (!passVal) { missing.push(isRtl ? 'كلمة المرور' : 'Password'); errMap.password = true; }
        if (!phoneVal) { missing.push(isRtl ? 'رقم الهاتف' : 'Phone Number'); errMap.phone = true; }
        if (!dobVal) { missing.push(isRtl ? 'تاريخ الميلاد' : 'Date of Birth'); errMap.dateOfBirth = true; }
        if (!genderVal) { missing.push(isRtl ? 'الجنس' : 'Gender'); errMap.gender = true; }
        if (!countryVal) { missing.push(isRtl ? 'الدولة / المدينة' : 'Country / City'); errMap.country = true; }
        if (!bioVal) { missing.push(isRtl ? 'الهدف / النبذة' : 'Bio / Goal'); errMap.bio = true; }
        if (!weightNum || isNaN(weightNum) || weightNum <= 0) {
          missing.push(isRtl ? 'الوزن (كجم)' : 'Weight (kg)');
          errMap.weightKg = true;
        }
        if (!heightNum || isNaN(heightNum) || heightNum <= 0) {
          missing.push(isRtl ? 'الطول (سم)' : 'Height (cm)');
          errMap.heightCm = true;
        }

        setMissingFieldsMap(errMap);

        if (missing.length > 0) {
          soundFX.playClick();
          setValidationError(
            isRtl
              ? `⚠️ يرجى إكمال الحقول الإجبارية التالية للدخول للبرنامج: (${missing.join('، ')})`
              : `⚠️ Please fill in the following required fields to enter: (${missing.join(', ')})`
          );
          return;
        }

        setValidationError('');
        soundFX.playCelebration();

        const completedProfile = {
          ...profile,
          name: nameVal,
          username: usernameVal,
          email: emailVal,
          phone: phoneVal,
          dateOfBirth: dobVal,
          gender: genderVal,
          country: countryVal,
          cityName: countryVal || profile.cityName || 'الإسكندرية، مصر',
          bio: bioVal,
          weightKg: Math.round(weightNum),
          heightCm: Math.round(heightNum),
          waterDailyTargetMl: Math.max(1500, Math.round(weightNum * 35)),
          workoutSplitId: profile.workoutSplitId || 'ppl',
          trainingDays: Array.isArray(profile.trainingDays) && profile.trainingDays.length > 0
            ? profile.trainingDays
            : [6, 0, 1, 3, 4],
          isOnboarded: true
        };

        onComplete(completedProfile);
      };

      const handleCheckCloudLogin = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const emailVal = normalizeDigits(String(profile.email || '').trim());
        const passVal = String(password || '').trim();
        if (!emailVal || !passVal) {
          setValidationError(
            isRtl
              ? '⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور كاملة لتسجيل الدخول.'
              : '⚠️ Please enter both your email address and password to sign in.'
          );
          return;
        }
        setValidationError('');
        setIsRestoring(true);
        setRestoreMsg(dict.common.syncing);

        let cloudData = null;
        try {
          cloudData = await Promise.race([
            fetchClientStateFromCloud(emailVal, profile.clientId),
            new Promise((resolve) => setTimeout(() => resolve(null), 1800))
          ]);
        } catch (err) { }

        setIsRestoring(false);
        if (cloudData && cloudData.state) {
          soundFX.playCelebration();
          setRestoreMsg('⚡ Account Restored!');
          onRestoreCloud(cloudData.state);
          return;
        }

        // Allow direct entry if they have filled profile data or switch cleanly to signup form
        if (profile.name && profile.weightKg && profile.heightCm) {
          soundFX.playCelebration();
          onComplete({ ...profile, email: emailVal, isOnboarded: true });
        } else {
          setAuthMode('signup');
          setValidationError(
            isRtl
              ? 'ℹ️ هذا البريد يسجل لأول مرة على هذا الجهاز — يرجى استكمال بيانات الفورم الإجباري بالأسفل ثم الضغط على زر الدخول.'
              : 'ℹ️ First time on this device — please complete the mandatory registration fields below to enter.'
          );
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-3 sm:p-6 pb-20">
          <div className="w-full max-w-4xl hero-card rounded-3xl p-5 sm:p-8 relative overflow-hidden">
            {/* Top Bar with Pure Turquoise Wordmark (No Logo Icon Box) & 6-Language Switcher */}
            <div className="flex flex-wrap items-center justify-between gap-3 border-b theme-border pb-4 mb-5">
              <div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2">
                  <span>{dict.auth.welcomeTitle.replace("خطوة", "")}</span>
                  <BrandName />
                </h1>
                <p className="text-xs theme-text-muted font-bold mt-1">
                  {isRtl
                    ? 'تسجيل البيانات إجباري بالكامل — املأ الفورم واضغط على زر الدخول لبدء استخدام البرنامج فوراً'
                    : 'Mandatory Registration — Complete all fields below to enter the application immediately'}
                </p>
              </div>

              <select
                aria-label="Language Selector"
                value={profile.language}
                onChange={(e) => { soundFX.playClick(); setProfile({ ...profile, language: e.target.value }); }}
                className="px-3 py-2 rounded-xl surface-field text-xs font-black touch-target"
              >
                {LANGUAGES_LIST.map((l) => (
                  <option key={l.code} value={l.code}>
                    {l.flag} {l.nativeName}
                  </option>
                ))}
              </select>
            </div>

            {/* Sign-Up vs Login Segmented Switcher */}
            <div className="grid grid-cols-2 gap-2 p-1 rounded-2xl surface-field mb-5">
              <button
                type="button"
                onClick={() => { soundFX.playClick(); setAuthMode('signup'); setValidationError(''); }}
                className={`py-2.5 rounded-xl text-xs font-black transition-all ${authMode === 'signup' ? 'btn-primary' : 'theme-text-muted'}`}
              >
                {dict.auth.signUpTab} (الفورم الكامل الإجباري)
              </button>
              <button
                type="button"
                onClick={() => { soundFX.playClick(); setAuthMode('login'); setValidationError(''); }}
                className={`py-2.5 rounded-xl text-xs font-black transition-all ${authMode === 'login' ? 'btn-primary' : 'theme-text-muted'}`}
              >
                {dict.auth.loginTab}
              </button>
            </div>

            {/* Validation Error Alert Box */}
            {validationError && (
              <div
                role="alert"
                className="mb-4 p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-500/10 text-rose-600 text-xs sm:text-sm font-black leading-relaxed"
              >
                {validationError}
              </div>
            )}

            {authMode === 'login' ? (
              <form onSubmit={handleCheckCloudLogin} className="space-y-4 py-2">
                <div>
                  <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.email} *</label>
                  <input
                    type="text"
                    inputMode="email"
                    value={profile.email || ''}
                    placeholder="name@example.com"
                    onChange={(e) => setProfile({ ...profile, email: e.target.value })}
                    className="w-full px-4 py-3 rounded-xl surface-field text-sm font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.password} *</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full px-4 py-3 rounded-xl surface-field text-sm font-bold"
                  />
                </div>
                {restoreMsg && <p className="text-xs font-bold accent-text">{restoreMsg}</p>}
                <div className="flex flex-wrap items-center justify-between gap-3 pt-3">
                  <button
                    type="submit"
                    disabled={isRestoring}
                    className="btn-primary px-6 py-3.5 rounded-2xl text-sm font-black flex-1 touch-target"
                  >
                    {isRestoring ? '...' : dict.auth.loginBtn}
                  </button>
                </div>
              </form>
            ) : (
              <form ref={formRef} onSubmit={handleFullRegistrationSubmit} noValidate className="space-y-5">
                {/* Profile Avatar Upload & Presets */}
                <div className="surface-field p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-3.5">
                    <img
                      src={profile.avatar || AVATAR_PRESETS[0]}
                      alt="Avatar Preview"
                      className="w-16 h-16 rounded-full object-cover border-2 border-teal-500 shadow-md"
                    />
                    <div>
                      <div className="text-xs font-black">{dict.auth.avatar}</div>
                      <label className="inline-block mt-1.5 px-3 py-1.5 rounded-xl btn-primary text-xs font-black cursor-pointer">
                        <span>{dict.auth.uploadAvatar}</span>
                        <input type="file" accept="image/*" onChange={handleAvatarFileChange} className="hidden" />
                      </label>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {AVATAR_PRESETS.map((av, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => { soundFX.playClick(); setProfile({ ...profile, avatar: av }); }}
                        className={`w-9 h-9 rounded-full overflow-hidden border-2 transition-transform ${profile.avatar === av ? 'border-teal-500 scale-110' : 'border-transparent opacity-70'}`}
                      >
                        <img src={av} alt={`Preset ${idx + 1}`} className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                </div>

                {/* All Mandatory Personal & Body Metrics Fields in One Unified View */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.fullName} *</label>
                    <input
                      name="fullName"
                      type="text"
                      value={profile.name || ''}
                      placeholder={isRtl ? 'الاسم الكامل (إجباري)...' : 'Full Name (Required)...'}
                      onChange={(e) => setProfile({ ...profile, name: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold ${missingFieldsMap.name ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.username} *</label>
                    <input
                      name="username"
                      type="text"
                      value={profile.username || ''}
                      placeholder={isRtl ? 'اسم المستخدم (إجباري)...' : 'Username (Required)...'}
                      onChange={(e) => setProfile({ ...profile, username: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold ${missingFieldsMap.username ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.email} *</label>
                    <input
                      name="email"
                      type="text"
                      inputMode="email"
                      value={profile.email || ''}
                      placeholder="name@example.com"
                      onChange={(e) => setProfile({ ...profile, email: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold ${missingFieldsMap.email ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.password} *</label>
                    <input
                      name="password"
                      type="password"
                      value={password}
                      placeholder={isRtl ? 'كلمة المرور (إجباري)...' : 'Password (Required)...'}
                      onChange={(e) => setPassword(e.target.value)}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold ${missingFieldsMap.password ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div className="sm:col-span-2">
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.phone} *</label>
                    <div className="flex items-center gap-1.5" dir="ltr">
                      <select
                        aria-label="Country Calling Code"
                        value={profile.phoneCountryCode || '+20'}
                        onChange={(e) => setProfile({ ...profile, phoneCountryCode: e.target.value })}
                        className="w-36 px-2 py-2.5 rounded-xl surface-field text-xs font-mono font-bold shrink-0"
                      >
                        {WORLD_COUNTRY_CODES.map((c) => (
                          <option key={`${c.iso}_${c.code}`} value={c.code}>
                            {c.flag} {c.code} ({isRtl ? c.nameAr : c.nameEn})
                          </option>
                        ))}
                      </select>
                      <input
                        name="phone"
                        type="tel"
                        value={profile.phone || ''}
                        onChange={(e) => setProfile({ ...profile, phone: normalizeDigits(e.target.value) })}
                        placeholder="100 000 0000"
                        className={`flex-1 min-w-0 px-3 py-2.5 rounded-xl surface-field text-xs font-mono font-bold ${missingFieldsMap.phone ? 'border-2 border-rose-500' : ''}`}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.dob} *</label>
                    <input
                      name="dateOfBirth"
                      type="date"
                      value={profile.dateOfBirth || ''}
                      onChange={(e) => setProfile({ ...profile, dateOfBirth: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold ${missingFieldsMap.dateOfBirth ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.gender} *</label>
                    <select
                      name="gender"
                      value={profile.gender || ''}
                      onChange={(e) => setProfile({ ...profile, gender: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold ${missingFieldsMap.gender ? 'border-2 border-rose-500' : ''}`}
                    >
                      <option value="">{isRtl ? 'اختر الجنس (إجباري)...' : 'Select gender (Required)...'}</option>
                      <option value="male">{dict.auth.genderMale}</option>
                      <option value="female">{dict.auth.genderFemale}</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.country} *</label>
                    <input
                      name="country"
                      type="text"
                      value={profile.country || ''}
                      placeholder={isRtl ? 'الدولة / المدينة (إجباري)...' : 'Country / City (Required)...'}
                      onChange={(e) => setProfile({ ...profile, country: e.target.value, cityName: e.target.value || 'الإسكندرية، مصر' })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold ${missingFieldsMap.country ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">
                      {isRtl ? 'الوزن (كجم) *' : 'Weight (kg) *'}
                    </label>
                    <input
                      name="weightKg"
                      type="text"
                      inputMode="decimal"
                      value={profile.weightKg ?? ''}
                      placeholder={isRtl ? 'مثال: 75' : 'e.g. 75'}
                      onChange={(e) => {
                        const normVal = normalizeDigits(e.target.value);
                        setProfile({ ...profile, weightKg: normVal });
                      }}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-black ${missingFieldsMap.weightKg ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">
                      {isRtl ? 'الطول (سم) *' : 'Height (cm) *'}
                    </label>
                    <input
                      name="heightCm"
                      type="text"
                      inputMode="decimal"
                      value={profile.heightCm ?? ''}
                      placeholder={isRtl ? 'مثال: 175' : 'e.g. 175'}
                      onChange={(e) => {
                        const normVal = normalizeDigits(e.target.value);
                        setProfile({ ...profile, heightCm: normVal });
                      }}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-black ${missingFieldsMap.heightCm ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-black theme-text-muted mb-1">
                      {isRtl ? 'النظام الرياضي المفضل *' : 'Workout Split *'}
                    </label>
                    <select
                      value={profile.workoutSplitId || 'ppl'}
                      onChange={(e) => setProfile({ ...profile, workoutSplitId: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                    >
                      {Object.keys(SPLIT_DEFINITIONS).map((sKey) => (
                        <option key={sKey} value={sKey}>
                          {isRtl ? SPLIT_DEFINITIONS[sKey].nameAr : SPLIT_DEFINITIONS[sKey].nameEn}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="sm:col-span-2 lg:col-span-3">
                    <label className="block text-xs font-black theme-text-muted mb-1">{dict.auth.bio} *</label>
                    <input
                      name="bio"
                      type="text"
                      value={profile.bio || ''}
                      placeholder={isRtl ? 'اكتب هدفك الصحي أو نبذة قصيرة عنك (إجباري)...' : 'Your main health/productivity goal (Required)...'}
                      onChange={(e) => setProfile({ ...profile, bio: e.target.value })}
                      className={`w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold ${missingFieldsMap.bio ? 'border-2 border-rose-500' : ''}`}
                    />
                  </div>
                </div>

                {/* Age Group & Training Days Selection */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
                  <div className="lg:col-span-7 grid grid-cols-2 gap-2">
                    {Object.keys(dict.ageGroups).map((gKey) => {
                      const item = dict.ageGroups[gKey];
                      const active = profile.ageGroup === gKey;
                      return (
                        <button
                          key={gKey}
                          type="button"
                          onClick={() => handleSelectAgeGroup(gKey)}
                          className={`p-3 rounded-2xl border logical-start-text transition-all ${active ? 'border-teal-500 bg-teal-500/15 shadow-sm' : 'surface-field opacity-85'
                            }`}
                        >
                          <div className="font-black text-xs">{item.label}</div>
                          <div className="text-[10px] theme-text-muted mt-0.5 line-clamp-1">{item.desc}</div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="lg:col-span-5 surface-field p-3.5 rounded-2xl flex flex-col justify-between">
                    <div className="text-xs font-black accent-text mb-2">
                      {isRtl ? 'أيام التدريب الأسبوعية *' : 'Weekly Training Days *'}
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                      {[6, 0, 1, 2, 3, 4, 5].map((dIdx) => {
                        const active = (profile.trainingDays || []).includes(dIdx);
                        return (
                          <button
                            key={dIdx}
                            type="button"
                            onClick={() => toggleTrainingDay(dIdx)}
                            className={`py-2 rounded-xl text-[11px] font-black border touch-target ${active ? 'btn-primary border-transparent' : 'glass-card opacity-75'
                              }`}
                          >
                            {isRtl ? DAYS_AR[dIdx] : DAYS_EN[dIdx].slice(0, 3)}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Direct 1-Click Submit Button once all fields are filled */}
                <div className="flex flex-wrap items-center justify-between gap-3 border-t theme-border pt-4 mt-4">
                  <span className="text-xs font-bold theme-text-muted">
                    {isRtl ? '* جميع الحقول أعلاه إجبارية للدخول للبرنامج' : '* All fields above are mandatory to enter'}
                  </span>

                  <button
                    id="submit-mandatory-registration-btn"
                    type="submit"
                    className="btn-primary px-8 py-3.5 rounded-2xl text-sm sm:text-base font-black touch-target shadow-xl"
                  >
                    {dict.auth.createAccountBtn}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    };

    // ============================================================================
    // 2. FULL-SCREEN STANDALONE 7-TAB ENTERPRISE SETTINGS SYSTEM (EMBEDDED IN INDEX)
    // Takes 100% of the screen with full-viewport tabs & instant return to the app
    // ============================================================================
    const GlobalSettingsModal = ({
      isOpen,
      onClose,
      user,
      onUpdateUser,
      onLogoutAccount,
      onDeleteAccountPermanently,
      onShowToast
    }) => {
      const [activeSection, setActiveSection] = useState('appearance');
      const [draftProfile, setDraftProfile] = useState(user);
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [cacheSizeKB, setCacheSizeKB] = useState(() => calculateCacheSizeKB());
      const [legalDocModal, setLegalDocModal] = useState(null);

      useEffect(() => {
        setDraftProfile(user);
        setCacheSizeKB(calculateCacheSizeKB());
      }, [user, isOpen]);

      if (!isOpen) return null;

      const lang = user.language || 'ar';
      const dict = I18N[lang] || I18N.ar;
      const s = dict.settings;
      const isRtl = dict.dir === 'rtl';

      const handleAvatarUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        compressAvatarImage(file, (compressedDataUrl) => {
          setDraftProfile((prev) => ({ ...prev, avatar: compressedDataUrl }));
          onUpdateUser({ avatar: compressedDataUrl });
        });
      };

      const handleSaveProfileChanges = () => {
        const cleanName = String(draftProfile.name || '').trim();
        const cleanEmail = String(draftProfile.email || '').trim();
        if (!cleanName || !cleanEmail) {
          onShowToast(isRtl ? '⚠️ الاسم والبريد الإلكتروني حقول أساسية مطلوبة' : '⚠️ Name and Email are required');
          return;
        }
        soundFX.playCelebration();
        const w = Number(normalizeDigits(draftProfile.weightKg)) || 75;
        const h = Number(normalizeDigits(draftProfile.heightCm)) || 175;
        onUpdateUser({
          name: cleanName,
          username: String(draftProfile.username || '').trim(),
          email: cleanEmail,
          phoneCountryCode: draftProfile.phoneCountryCode || '+20',
          phone: normalizeDigits(draftProfile.phone),
          dateOfBirth: draftProfile.dateOfBirth,
          gender: draftProfile.gender,
          country: draftProfile.country,
          cityName: draftProfile.country || draftProfile.cityName,
          bio: draftProfile.bio,
          avatar: draftProfile.avatar,
          weightKg: w,
          heightCm: h,
          fitnessGoal: draftProfile.fitnessGoal || 'recomp',
          workoutSplitId: draftProfile.workoutSplitId || 'ppl',
          waterDailyTargetMl: Number(normalizeDigits(draftProfile.waterDailyTargetMl)) || Math.round(w * 35),
          wakeTime: draftProfile.wakeTime || '06:00',
          sleepTime: draftProfile.sleepTime || '23:00'
        });
        onShowToast(s.profileSec.savedToast);
      };

      const handlePasswordChange = () => {
        if (!newPass || newPass !== confirmPass) {
          onShowToast(isRtl ? '⚠️ يرجى التأكد من تطابق كلمة المرور الجديدة' : '⚠️ Passwords must match');
          return;
        }
        soundFX.playCelebration();
        setCurrentPass('');
        setNewPass('');
        setConfirmPass('');
        onShowToast(isRtl ? '🔐 تم تحديث كلمة المرور بنجاح!' : '🔐 Password updated securely!');
      };

      const handleClearCache = () => {
        soundFX.playCelebration();
        setCacheSizeKB(2);
        onShowToast(s.notificationsSec.cacheClearedToast);
      };

      const sections = [
        { id: 'appearance', icon: '🎨', label: isRtl ? 'الثيمات والمظهر (16 ثيم)' : '16 Themes & Appearance' },
        { id: 'profile', icon: '👤', label: isRtl ? 'الملف الشخصي والقياسات' : s.tabs.profile },
        { id: 'faith', icon: '🕌', label: isRtl ? 'إعدادات الصلاة والأذان' : 'Prayer & Adhan Studio' },
        { id: 'language', icon: '🌐', label: isRtl ? 'اللغات والوقت (6 لغات)' : s.tabs.language },
        { id: 'notifications', icon: '🔔', label: isRtl ? 'الإشعارات والصوت والبيانات' : s.tabs.notifications },
        { id: 'security', icon: '🛡️', label: isRtl ? 'الأمان وإلغاء الحساب' : 'Security & Delete Account' },
        { id: 'legal', icon: 'ℹ️', label: s.tabs.legal }
      ];

      return (
        <div
          id="fullscreen-settings-page"
          className="fixed inset-0 z-50 w-screen h-screen overflow-y-auto flex flex-col pb-20"
          style={{
            background: 'var(--bg-gradient, var(--bg-primary))',
            backgroundColor: 'var(--bg-primary)',
            color: 'var(--text-main)'
          }}
        >
          {/* Sticky Full-Screen Settings Top Bar */}
          <div className="sticky top-0 z-30 glass-card border-x-0 border-t-0 rounded-none px-4 sm:px-8 py-3.5 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="w-11 h-11 rounded-2xl btn-primary flex items-center justify-center text-xl shadow-md">
                  ⚙️
                </span>
                <div className="logical-start-text">
                  <div className="flex items-center gap-2">
                    <h2 className="text-lg sm:text-xl font-black leading-tight">{s.title}</h2>
                    <BrandName className="text-base sm:text-lg" />
                  </div>
                  <p className="text-xs theme-text-muted font-bold">{s.subtitle}</p>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <button
                  type="button"
                  onClick={() => {
                    setActiveSection('security');
                    setShowDeleteConfirm(true);
                  }}
                  className="px-3.5 py-2.5 rounded-2xl bg-rose-600/15 border border-rose-500/40 text-rose-600 hover:bg-rose-600 hover:text-white text-xs font-black transition-all touch-target"
                >
                  🗑️ {isRtl ? 'إلغاء الحساب' : 'Delete Account'}
                </button>

                <button
                  id="exit-fullscreen-settings-btn"
                  type="button"
                  onClick={() => {
                    soundFX.playClick();
                    onClose();
                  }}
                  className="btn-primary px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-black flex items-center gap-2 shadow-lg touch-target"
                >
                  <span>{isRtl ? 'العودة للبرنامج والخروج من الإعدادات' : 'Back to App'}</span>
                  <span>{isRtl ? '←' : '→'}</span>
                </button>
              </div>
            </div>

            {/* Full-Width Horizontal Tabs Bar inside the Sticky Header */}
            <div className="max-w-7xl mx-auto pt-3 mt-3 border-t theme-border flex items-center gap-2 overflow-x-auto no-scrollbar">
              {sections.map((sec) => {
                const active = activeSection === sec.id;
                return (
                  <button
                    key={sec.id}
                    type="button"
                    onClick={() => {
                      soundFX.playClick();
                      setActiveSection(sec.id);
                    }}
                    className={`px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-black flex items-center gap-2 shrink-0 transition-all touch-target ${active
                        ? 'btn-primary shadow-lg scale-[1.02]'
                        : 'surface-field opacity-85 hover:opacity-100'
                      }`}
                  >
                    <span className="text-base">{sec.icon}</span>
                    <span>{sec.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Quick System Status & Action Strip */}
          <div className="w-full border-b theme-border py-2.5 px-4 sm:px-8 surface-field rounded-none">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              <button
                type="button"
                onClick={() => {
                  const nextVoice = user.voiceAssistantEnabled === false ? true : false;
                  onUpdateUser({ voiceAssistantEnabled: nextVoice });
                  if (nextVoice) {
                    speakAssistantText('تم تفعيل النطق الصوتي للمساعد الذكي في تطبيق خطوة', true, user.language || 'ar');
                  } else {
                    stopAssistantSpeechAndAlarms();
                  }
                  onShowToast(nextVoice ? '🔊 تم تفعيل النطق الصوتي للمساعد' : '🔇 تم كتم النطق الصوتي للمساعد');
                }}
                className="glass-card px-3.5 py-2.5 rounded-2xl text-xs font-black flex items-center justify-between gap-2"
              >
                <span>🔊 النطق الصوتي للمساعد</span>
                <span className="px-2.5 py-0.5 rounded-full bg-teal-500/20 accent-text">
                  {user.voiceAssistantEnabled !== false ? 'مفعل ✅' : 'مكتوم 🔇'}
                </span>
              </button>

              <button
                type="button"
                onClick={() => {
                  const isCurrentlyLight = LIGHT_THEME_IDS.includes(user.theme);
                  const nextTheme = isCurrentlyLight ? 'turquoise_dark' : 'turquoise_light';
                  onUpdateUser({
                    theme: nextTheme,
                    themeMode: isCurrentlyLight ? 'dark' : 'light',
                    accentColor: isCurrentlyLight ? '#14B8A6' : '#0D9488'
                  });

      // Tasbih Target State

      const [activeAdhanAlert, setActiveAdhanAlert] = useState(null);
      const [isPreviewingAdhan, setIsPreviewingAdhan] = useState(false);
      const lastTriggeredAdhanRef = useRef('');

      // New Medicine State
      const [showMedModal, setShowMedModal] = useState(false);
      const [medName, setMedName] = useState('');
      const [medDose, setMedDose] = useState('1 Cap');
      const [medTime, setMedTime] = useState('09:00');
      const [medCat, setMedCat] = useState('vitamin');

      // New Family Birthday State
      const [famName, setFamName] = useState('');
      const [famRel, setFamRel] = useState('Family');
      const [famDate, setFamDate] = useState('');

      // Zero-Friction Smart AI Voice / Text Quick-Capture State
      const [quickInputText, setQuickInputText] = useState('');
      const [isListeningVoice, setIsListeningVoice] = useState(false);
      const [isOnline, setIsOnline] = useState(() => typeof navigator !== 'undefined' ? navigator.onLine : true);

      useEffect(() => {
        const onOnline = () => setIsOnline(true);
        const onOffline = () => setIsOnline(false);
        window.addEventListener('online', onOnline);
        window.addEventListener('offline', onOffline);
        return () => {
          window.removeEventListener('online', onOnline);
          window.removeEventListener('offline', onOffline);
        };
      }, []);

      const handleSmartQuickCapture = (rawText) => {
        const text = SecurityGuard.sanitizeInput(String(rawText || quickInputText || '').trim(), 200);
        if (!text) return;
        const lower = text.toLowerCase();
        const numMatch = text.match(/(\d+)/);
        const numVal = numMatch ? parseInt(numMatch[1], 10) : null;

        if (lower.includes('ماء') || lower.includes('ميه') || lower.includes('water') || lower.includes('ml') || lower.includes('پانی') || lower.includes('su') || lower.includes('eau')) {
          const ml = numVal && numVal >= 50 && numVal <= 3000 ? numVal : 250;
          handleAddWater(ml, `⚡ ${ml}ml`);
          showToast(`💧 +${ml}ml Water logged (+5 XP)!`);
        } else if (lower.includes('بروتين') || lower.includes('وجبة') || lower.includes('protein') || lower.includes('meal') || lower.includes('kcal') || lower.includes('سعرة')) {
          const grams = numVal && numVal <= 250 ? numVal : 30;
          soundFX.playCelebration();
          setState((prev) => ({
            ...prev,
            vitals: {
              ...prev.vitals,
              proteinGrams: (prev.vitals.proteinGrams || 0) + grams,
              caloriesConsumed: (prev.vitals.caloriesConsumed || 0) + (grams * 12)
            }
          }));
          awardXP(10);
          showToast(`🥗 +${grams}g Protein Meal logged (+10 XP)!`);
        } else if (lower.includes('خطوة') || lower.includes('خطوات') || lower.includes('مشي') || lower.includes('step') || lower.includes('walk')) {
          const stp = numVal && numVal >= 100 ? numVal : 1000;
          soundFX.playClick();
          setState((prev) => ({
            ...prev,
            vitals: { ...prev.vitals, steps: (prev.vitals.steps || 0) + stp }
          }));
          awardXP(10);
          showToast(`👟 +${stp} Steps logged (+10 XP)!`);
        } else {
          soundFX.playClick();
          setState((prev) => ({
            ...prev,
            tasks: [
              { id: `tsk_${Date.now()}`, titleAr: text, titleEn: text, priority: 'high', completed: false },
              ...prev.tasks
            ]
          }));
          awardXP(5);
          showToast(`✅ Task added: "${text}"`);
        }
        setQuickInputText('');
      };

      const [voiceDictationTarget, setVoiceDictationTarget] = useState(null); // 'quick' | 'chat' | 'task' | null

        if (!SpeechRec) {
